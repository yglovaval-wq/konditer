<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация — Народный кондитер</title>
    <!-- Иконки Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <style>
        .auth-section {
            padding: 60px 0;
            min-height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-card {
            background-color: #fff;
            border-radius: 12px;
            padding: 35px 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .auth-title {
            font-size: 26px;
            color: #2C241D;
            margin-bottom: 20px;
        }

        .auth-title span {
            color: #EF9339;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 2px solid #f0f0f0;
        }

        .auth-tab {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            font-size: 16px;
            font-weight: bold;
            color: #888;
            cursor: pointer;
            transition: color 0.3s, border-bottom 0.3s;
        }

        .auth-tab.active {
            color: #EF9339;
            border-bottom: 2px solid #EF9339;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .auth-form.hidden {
            display: none;
        }

        .input-box {
            position: relative;
            text-align: left;
        }

        .input-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
        }

        .input-box input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }

        .input-box input:focus {
            border-color: #EF9339;
        }

        .btn-submit {
            padding: 12px;
            background-color: #EF9339;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #d87f28;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- Шапка сайта -->
        <header class="container">
            <span class="logo">Народный кондитер</span>
            
            <button class="mobile-menu-btn" id="mobileMenuToggle" aria-label="Открыть меню">
                <i class="fa-solid fa-bars"></i>
            </button>

            <nav id="navMenu">
                <ul>
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="index.html#cakes">Торты</a></li>
                    <li><a href="index.html#contacts">Контакты</a></li>
                    <li><a href="cart.html">Корзина <span id="cartCountBadge" class="cart-badge" style="display:none;">0</span></a></li>
                    <li class="btn active" id="authNavBtn"><a href="auth.html">Вход</a></li>
                </ul>
            </nav>
        </header>

        <!-- Форма авторизации и регистрации -->
        <section class="auth-section">
            <div class="auth-card">
                <h1 class="auth-title">Добро <span>пожаловать!</span></h1>

                <div class="auth-tabs">
                    <button class="auth-tab active" id="tabLogin">Вход</button>
                    <button class="auth-tab" id="tabRegister">Регистрация</button>
                </div>

                <!-- Форма Входа -->
                <form id="loginForm" class="auth-form">
                    <div class="input-box">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="loginEmail" placeholder="Ваша почта" required>
                    </div>
                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="loginPassword" placeholder="Пароль" required>
                    </div>
                    <button type="submit" class="btn-submit">Войти</button>
                </form>

                <!-- Форма Регистрации -->
                <form id="registerForm" class="auth-form hidden">
                    <div class="input-box">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="regEmail" placeholder="Ваша почта" required>
                    </div>
                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="regPassword" placeholder="Пароль" required>
                    </div>
                    <button type="submit" class="btn-submit">Зарегистрироваться</button>
                </form>
            </div>
        </section>
    </div>

    <!-- Всплывающее уведомление -->
    <div id="toastNotification" class="toast-notification"></div>

    <script>
        function showNotification(message) {
            const toast = document.getElementById('toastNotification');
            if (toast) {
                toast.textContent = message;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2500);
            } else {
                alert(message);
            }
        }

        // Вспомогательная функция получения корзины
        function getCart() {
            return JSON.parse(localStorage.getItem('cart')) || JSON.parse(localStorage.getItem('bakeryCart')) || [];
        }

        // Обновление счетчика корзины
        function updateCartBadge() {
            const cart = getCart();
            const badge = document.getElementById('cartCountBadge');
            const totalCount = cart.reduce((sum, item) => sum + (Number(item.quantity) || 1), 0);
            if (badge) {
                if (totalCount > 0) {
                    badge.textContent = totalCount;
                    badge.style.display = 'inline-block';
                } else {
                    badge.style.display = 'none';
                }
            }
        }

        // Переключение вкладок "Вход" и "Регистрация"
        const tabLogin = document.getElementById('tabLogin');
        const tabRegister = document.getElementById('tabRegister');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');

        tabLogin.addEventListener('click', () => {
            tabLogin.classList.add('active');
            tabRegister.classList.remove('active');
            loginForm.classList.remove('hidden');
            registerForm.classList.add('hidden');
        });

        tabRegister.addEventListener('click', () => {
            tabRegister.classList.add('active');
            tabLogin.classList.remove('active');
            registerForm.classList.remove('hidden');
            loginForm.classList.add('hidden');
        });

        // 1. ВХОД (авторизация через сервер Node.js)
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userId', data.user.id);
                    localStorage.setItem('userEmail', data.user.username);

                    showNotification('Успешный вход! Переходим на главную...');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                } else {
                    showNotification(data.error || 'Неверный логин или пароль');
                }
            } catch (error) {
                showNotification('Ошибка подключения к серверу');
            }
        });

        // 2. РЕГИСТРАЦИЯ (через сервер Node.js)
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userId', data.userId);
                    localStorage.setItem('userEmail', email);

                    showNotification('Регистрация успешна! Вход выполнен.');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                } else {
                    showNotification(data.error || 'Ошибка при регистрации');
                }
            } catch (error) {
                showNotification('Ошибка подключения к серверу');
            }
        });

        // Состояние кнопки входа/выхода
        function updateAuthNav() {
            const authBtn = document.getElementById('authNavBtn');
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            if (authBtn && isLoggedIn) {
                authBtn.innerHTML = `<a href="#" onclick="logoutUser(event)"><i class="fa-solid fa-right-from-bracket"></i> Выйти</a>`;
            }
        }

        function logoutUser(e) {
            e.preventDefault();
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('userId');
            localStorage.removeItem('userEmail');
            window.location.reload();
        }

        // Мобильное меню
        const mobileToggle = document.getElementById('mobileMenuToggle');
        const navMenu = document.getElementById('navMenu');
        if (mobileToggle && navMenu) {
            mobileToggle.addEventListener('click', () => {
                navMenu.classList.toggle('active');
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateCartBadge();
            updateAuthNav();
        });
    </script>
</body>
</html>
