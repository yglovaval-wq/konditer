<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина — Народный кондитер</title>
    <!-- Иконки Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <style>
        .cart-section {
            padding: 50px 0;
            min-height: 70vh;
        }

        .cart-card {
            background-color: #fff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 900px;
            margin: 0 auto;
        }

        .cart-title {
            font-size: 28px;
            color: #2C241D;
            margin-bottom: 25px;
            border-bottom: 2px solid #EF9339;
            padding-bottom: 10px;
        }

        .cart-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
        }

        .cart-table th {
            text-align: left;
            padding: 12px;
            background-color: #FAF6F0;
            color: #2C241D;
            font-size: 16px;
        }

        /* Исправление: явный цвет текста для ячеек */
        .cart-table td {
            padding: 15px 12px;
            border-bottom: 1px solid #f0f0f0;
            vertical-align: middle;
            color: #2C241D;
            font-size: 15px;
        }

        .cart-item-img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            display: block;
        }

        .cart-item-title {
            font-weight: bold;
            color: #2C241D;
        }

        .qty-btn {
            background-color: #EF9339;
            color: white;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: background-color 0.2s;
        }

        .qty-btn:hover {
            background-color: #d87f28;
        }

        .btn-remove {
            background: none;
            border: none;
            color: #e74c3c;
            cursor: pointer;
            font-size: 18px;
            transition: color 0.2s;
        }

        .btn-remove:hover {
            color: #c0392b;
        }

        .cart-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px solid #2C241D;
            padding-top: 20px;
            margin-top: 20px;
        }

        .total-price {
            font-size: 22px;
            font-weight: bold;
            color: #2C241D;
        }

        .btn-checkout {
            background-color: #EF9339;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-checkout:hover {
            background-color: #d87f28;
        }

        .empty-cart-msg {
            text-align: center;
            padding: 40px 0;
            color: #2C241D;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- Шапка сайта -->
        <header class="container">
            <span class="logo">Народный кондитер</span>
            
            <button class="mobile-menu-btn" id="mobileMenuToggle" aria-label="Открыть меню">
                <i class="fa-solid fa-bars"></i>
            </button>

            <nav id="navMenu">
                <ul>
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="index.html#cakes">Торты</a></li>
                    <li><a href="index.html#contacts">Контакты</a></li>
                    <li class="active"><a href="cart.html">Корзина <span id="cartCountBadge" class="cart-badge" style="display:none;">0</span></a></li>
                    <li class="btn" id="authNavBtn"><a href="auth.html">Вход</a></li>
                </ul>
            </nav>
        </header>

        <!-- Содержимое корзины -->
        <section class="cart-section container">
            <div class="cart-card">
                <h1 class="cart-title">Ваша корзина</h1>
                <div id="cartContent">
                    <!-- Таблица корзины формируется с помощью JS -->
                </div>
            </div>
        </section>
    </div>

    <!-- Всплывающее уведомление -->
    <div id="toastNotification" class="toast-notification"></div>

    <script>
        // Получение данных корзины
        function getCart() {
            return JSON.parse(localStorage.getItem('cart')) || JSON.parse(localStorage.getItem('bakeryCart')) || [];
        }

        // Сохранение корзины
        function saveCart(cart) {
            localStorage.setItem('cart', JSON.stringify(cart));
            localStorage.setItem('bakeryCart', JSON.stringify(cart));
        }

        // Всплывающее уведомление
        function showNotification(message) {
            const toast = document.getElementById('toastNotification');
            if (toast) {
                toast.textContent = message;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2500);
            } else {
                alert(message);
            }
        }

        // Обновление счетчика в шапке
        function updateCartBadge() {
            const cart = getCart();
            const badge = document.getElementById('cartCountBadge');
            const totalCount = cart.reduce((sum, item) => sum + (Number(item.quantity) || 1), 0);
            if (badge) {
                if (totalCount > 0) {
                    badge.textContent = totalCount;
                    badge.style.display = 'inline-block';
                } else {
                    badge.style.display = 'none';
                }
            }
        }

        // Отрисовка корзины
        function renderCart() {
            const cart = getCart();
            const container = document.getElementById('cartContent');

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="empty-cart-msg">
                        <p>Ваша корзина пуста.</p>
                        <br>
                        <a href="index.html#cakes" class="btn-checkout" style="display: inline-block; text-decoration: none;">Перейти к выбору тортов</a>
                    </div>
                `;
                return;
            }

            let totalPrice = 0;
            let html = `
                <table class="cart-table">
                    <thead>
                        <tr>
                            <th>Фото</th>
                            <th>Товар</th>
                            <th>Цена</th>
                            <th>Количество</th>
                            <th>Сумма</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            cart.forEach((item, index) => {
                const title = item.title || item.name || 'Товар';
                const price = Number(item.price) || 0;
                const quantity = Number(item.quantity) || 1;
                const image = item.image || item.img || 'images/default.jpg';
                const itemTotal = price * quantity;
                totalPrice += itemTotal;

                html += `
                    <tr>
                        <td><img src="${image}" alt="${title}" class="cart-item-img"></td>
                        <td class="cart-item-title">${title}</td>
                        <td>${price} ₽</td>
                        <td>
                            <button class="qty-btn" onclick="changeQuantity(${index}, -1)">-</button>
                            <span style="margin: 0 8px; font-weight: bold; display: inline-block; min-width: 20px; text-align: center;">${quantity}</span>
                            <button class="qty-btn" onclick="changeQuantity(${index}, 1)">+</button>
                        </td>
                        <td style="font-weight: bold;">${itemTotal} ₽</td>
                        <td>
                            <button class="btn-remove" onclick="removeItem(${index})" title="Удалить">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
                <div class="cart-summary">
                    <div class="total-price">Итого: ${totalPrice} ₽</div>
                    <button class="btn-checkout" onclick="handleCheckout()">Оформить заказ</button>
                </div>
            `;

            container.innerHTML = html;
        }

        // Изменение количества
        function changeQuantity(index, delta) {
            let cart = getCart();
            if (cart[index]) {
                cart[index].quantity = (Number(cart[index].quantity) || 1) + delta;
                if (cart[index].quantity <= 0) {
                    cart.splice(index, 1);
                }
                saveCart(cart);
                renderCart();
                updateCartBadge();
            }
        }

        // Удаление товара
        function removeItem(index) {
            let cart = getCart();
            cart.splice(index, 1);
            saveCart(cart);
            renderCart();
            updateCartBadge();
            showNotification('Товар удален из корзины');
        }

        // Оформление заказа
        function handleCheckout() {
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            if (!isLoggedIn) {
                showNotification('Пожалуйста, войдите в аккаунт для оформления заказа');
                setTimeout(() => {
                    window.location.href = 'auth.html';
                }, 1500);
                return;
            }

            showNotification('Заказ успешно оформлен!');
            saveCart([]);
            renderCart();
            updateCartBadge();
        }

        // Состояние кнопки авторизации в меню
        function updateAuthNav() {
            const authBtn = document.getElementById('authNavBtn');
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            if (authBtn && isLoggedIn) {
                authBtn.innerHTML = `<a href="#" onclick="logoutUser(event)"><i class="fa-solid fa-right-from-bracket"></i> Выйти</a>`;
            }
        }

        function logoutUser(e) {
            e.preventDefault();
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('userId');
            localStorage.removeItem('userEmail');
            window.location.reload();
        }

        // Мобильное меню
        const mobileToggle = document.getElementById('mobileMenuToggle');
        const navMenu = document.getElementById('navMenu');
        if (mobileToggle && navMenu) {
            mobileToggle.addEventListener('click', () => {
                navMenu.classList.toggle('active');
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderCart();
            updateCartBadge();
            updateAuthNav();
        });
    </script>
</body>
</html>
